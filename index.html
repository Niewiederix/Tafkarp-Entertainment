<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tafkarp-Entertainment</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    font-family: Arial, Helvetica, sans-serif;
  }

  #home {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }

  #home img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .overlay {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    display: none;
    align-items: center;
    justify-content: center;
    background: #000;
  }

  .overlay.active {
    display: flex;
  }

  .overlay img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .overlay-placeholder {
    display: none;
    position: absolute;
    inset: 0;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2em;
    color: #fff;
    font-size: 1.3rem;
    line-height: 1.6;
    background: repeating-linear-gradient(45deg, #1a1a1a, #1a1a1a 20px, #262626 20px, #262626 40px);
  }

  .close-btn {
    position: absolute;
    top: 20px;
    right: 20px;
    font-size: 1.5rem;
    background: none;
    border: none;
    color: #fff;
    cursor: pointer;
  }

  #close-evasive {
    position: absolute;
    top: 20px;
    right: 20px;
    font-size: 1.1rem;
    background: rgba(0, 0, 0, 0.5);
    border: 2px solid #fff;
    color: #fff;
    cursor: pointer;
    padding: 0.4em 0.8em;
  }

  #contact-form {
    background: #fff;
    padding: 2em;
    width: min(90vw, 400px);
    display: flex;
    flex-direction: column;
    gap: 1em;
  }

  #contact-form label {
    font-size: 0.9rem;
  }

  #contact-form input,
  #contact-form textarea {
    padding: 0.6em;
    font-size: 1rem;
    border: 1px solid #999;
    font-family: inherit;
  }

  #contact-form button {
    padding: 0.7em;
    font-size: 1rem;
    background: #222;
    color: #fff;
    border: none;
    cursor: pointer;
  }
</style>
</head>
<body>

  <section id="home">
    <img id="img-start" src="images/start.jpg" alt="Startbild">
    <div id="placeholder-start" class="overlay-placeholder">
      Hier kommt bald das Startbild hin.
    </div>
  </section>

  <div id="overlay-1" class="overlay">
    <img id="img-overlay1" src="images/overlay1.jpg" alt="Geheimes Vollbild">
    <div id="placeholder-overlay1" class="overlay-placeholder">
      Hier hängt bald ein Bild.<br>Der Schließen-Knopf lässt sich (mit Absicht) nicht so einfach fangen.
    </div>
    <button id="close-evasive">✕ Schließen</button>
  </div>

  <div id="overlay-2" class="overlay">
    <button class="close-btn" data-close="overlay-2">✕</button>
    <form id="contact-form">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required>

      <label for="email">E-Mail</label>
      <input type="email" id="email" name="email" required>

      <label for="message">Nachricht</label>
      <textarea id="message" name="message" rows="5" required></textarea>

      <button type="submit">Absenden</button>
    </form>
  </div>

<script>
  const overlay1 = document.getElementById('overlay-1');
  const overlay2 = document.getElementById('overlay-2');

  const img1 = document.getElementById('img-overlay1');
  const placeholder1 = document.getElementById('placeholder-overlay1');
  img1.addEventListener('error', () => {
    img1.style.display = 'none';
    placeholder1.style.display = 'flex';
    placeholder1.innerHTML += `<br><span style="font-size:0.85rem; opacity:0.7;">(gesucht unter: ${img1.getAttribute('src')})</span>`;
  });

  const imgStart = document.getElementById('img-start');
  const placeholderStart = document.getElementById('placeholder-start');
  imgStart.addEventListener('error', () => {
    imgStart.style.display = 'none';
    placeholderStart.style.display = 'flex';
    placeholderStart.innerHTML += `<br><span style="font-size:0.85rem; opacity:0.7;">(gesucht unter: ${imgStart.getAttribute('src')})</span>`;
  });

  document.querySelectorAll('[data-close]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.getElementById(btn.dataset.close).classList.remove('active');
    });
  });

  const evasiveBtn = document.getElementById('close-evasive');

  evasiveBtn.addEventListener('mouseenter', () => {
    const maxX = window.innerWidth - evasiveBtn.offsetWidth - 20;
    const maxY = window.innerHeight - evasiveBtn.offsetHeight - 20;
    evasiveBtn.style.left = (Math.random() * maxX) + 'px';
    evasiveBtn.style.top = (Math.random() * maxY) + 'px';
    evasiveBtn.style.right = 'auto';
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      overlay1.classList.remove('active');
      overlay2.classList.remove('active');
    }
  });

  document.getElementById('contact-form').addEventListener('submit', (e) => {
    e.preventDefault();
    alert('Formular ausgefüllt – für den echten Versand brauchen wir später noch eine Anbindung, z. B. über Formspree oder ein eigenes kleines Skript.');
  });
</script>

</body>
</html>
